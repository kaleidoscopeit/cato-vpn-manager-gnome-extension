name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GNOME tooling
        run: sudo apt-get update && sudo apt-get install -y gnome-shell gjs gettext libglib2.0-bin make unzip
      - name: Validate and package
        run: make package
      - name: Check extension archive
        run: |
          archive=$(find dist -maxdepth 1 -name '*.shell-extension.zip' -type f -print -quit)
          test -n "$archive"
          unzip -l "$archive"
          if unzip -Z1 dist/*.shell-extension.zip | grep -E '(^|/)(optional-helper|tests|tools|po|\.github|\.git|Makefile|.*\.png|schemas/gschemas\.compiled)(/|$)'; then
            echo "Unexpected development, generated or privileged content in extension archive" >&2
            exit 1
          fi
      - name: Upload extension package
        uses: actions/upload-artifact@v5
        with:
          name: cato-vpn-manager-${{ github.event_name }}-${{ github.run_number }}
          path: dist/*.shell-extension.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Download extension package
        uses: actions/download-artifact@v5
        with:
          pattern: cato-vpn-manager-*
          path: release-dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-dist/*.shell-extension.zip --generate-notes
